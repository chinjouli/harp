dataset:
  _target_: dataset.medmosaic.LongFormDataset
  data_dir: ${HARP_DATA_ROOT}/medmosaic/long_form
  metadata_path: ${HARP_DATA_ROOT}/medmosaic/long_form/Long_Form_metadata.json

extract:
  out_dir: data/medmosaic
  clip_audio_dir: data/medmosaic
  batch_size: 4
  max_seg_sec: 15
  asr:
    _target_: extract.audio_expert.asr.whisper.WhisperASR
    model_name: large-v3-turbo
  diar:
    _target_: extract.audio_expert.diar.pyannote.PyannoteDiar
  text_emb:
    _target_: extract.audio_expert.emb.text.SentenceEmb
    model_name: BAAI/bge-small-en-v1.5
  audio_emb:
    _target_: extract.audio_expert.emb.audio.OpenBEATsEmb
    checkpoint: espnet/OpenBEATS-Large-i2-as20k
    chunk_seconds: 15
  domain_labelers:
    # requires a local coughkit checkout; see extract/README.md
    - _target_: extract.domain_expert.health.labeler_coughkit_count.CoughKitCounter
      threshold: 0.8
  domain_embedders: []

inference:
  out_dir: data/medmosaic
  queries: data/medmosaic/queries.jsonl
  predictions: data/medmosaic/predictions.jsonl
  task: health
  audio_dir: ${HARP_DATA_ROOT}/medmosaic/long_form
  top_k: 3
  # available modalities: [time, keyword, label, text_emb, audio_emb, domain_emb, audio]
  modalities: [time, keyword, label, text_emb, audio_emb, audio]
  text_emb:
    _target_: extract.audio_expert.emb.text.SentenceEmb
    model_name: BAAI/bge-small-en-v1.5
  llm:
    _target_: inference.llm.qwen3_omni.Qwen3Omni
    model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
    base_url: http://localhost:8091/v1
  use_vec_cache: false
  # # acoustic section similarity (OpenBEATs general audio embedding)
  # audio_emb:
  #   _target_: extract.audio_expert.emb.audio.OpenBEATsEmb
  #   checkpoint: espnet/OpenBEATS-Large-i2-as20k
  #   chunk_seconds: 15

evaluate:
  out_dir: data/medmosaic
  predictions: data/medmosaic/predictions.jsonl
  gt_dir: data/medmosaic/gt
  metadata_path: ${HARP_DATA_ROOT}/medmosaic/long_form/Long_Form_metadata.json
  prompts: evaluate.prompts.health
  judge:
    _target_: evaluate.judge.gemini.GeminiJudge
    model_id: gemini-3.1-flash-lite
    max_tokens: 512
